name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git just clang22

      - uses: actions/checkout@v6

      - name: Check formatting
        env:
          PATH: /usr/lib/llvm22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: just format-check

  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc just clang zsh

      - uses: actions/checkout@v6

      - name: Build
        run: just build

      - name: Test
        run: just test debug --print-errorlogs

      - name: Check zsh completions (source and autoload)
        run: |
          zsh -fc 'autoload -Uz compinit; compinit -i -D; source <(./build-debug/noctalia completions zsh); [[ ${_comps[noctalia]} == _noctalia ]]'
          completions_dir="$(mktemp -d)"
          trap 'rm -rf "$completions_dir"' EXIT
          ./build-debug/noctalia completions zsh > "$completions_dir/_noctalia"
          ZSH_COMPLETION_DIR="$completions_dir" zsh -fc 'fpath=("$ZSH_COMPLETION_DIR" $fpath); autoload -Uz compinit; compinit -i -D; [[ ${_comps[noctalia]} == _noctalia ]]'

      - name: Lint
        run: just lint
